version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    pre_build:
      # Mirror the notebook tree into the docs build (Jupyter Book renders them in place).
      - mkdir -p docs/tutorials
      - cp notebooks/*.ipynb docs/tutorials/
    build:
      html:
        # Serial build; RTD's default command adds -j auto, but sphinx-tippy is
        # not parallel-safe: worker-rendered pages reference per-page tip files
        # that never get written, so hover previews 404 on the deployed site.
        - python -m sphinx -T -b html -d docs/_build/doctrees docs $READTHEDOCS_OUTPUT/html

sphinx:
  configuration: docs/conf.py

python:
  install:
    - requirements: docs/requirements.txt
