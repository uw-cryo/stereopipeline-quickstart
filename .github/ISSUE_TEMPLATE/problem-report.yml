name: Problem report
description: Something in this guide is broken, wrong, or unclear
body:
  - type: input
    id: location
    attributes:
      label: Where did you hit this?
      description: A docs page URL, a notebook name and cell, or a pipeline step.
      placeholder: e.g. notebooks/01_aster_rainier.ipynb, the parallel_stereo cell
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Paste error output as text where possible.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - GitHub Codespace
        - Local install
        - Just reading the docs
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, log files, links.
    validations:
      required: false
