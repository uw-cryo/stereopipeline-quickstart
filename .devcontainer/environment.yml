name: asp
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  # Notebook UI
  - jupyterlab
  - notebook
  - ipywidgets
  # Geospatial stack (asp_plot pulls these in via pip too, but conda-forge builds
  # are smoother for GDAL/rasterio/etc.)
  - gdal
  - rasterio
  - rioxarray
  - geopandas
  - shapely
  - pyproj
  - contextily
  # AWS access for SpaceNet + COP-DEM open buckets
  - boto3
  - s3fs
  - awscli
  # Plotting
  - matplotlib
  - seaborn
  - pip:
      # Pull asp_plot from PyPI; conda-forge package exists too but PyPI is
      # always one step ahead during active development. Capped below the
      # next major version, which may break the notebooks' asp_report calls
      # (architecture/0021-asp-plot-major-version-bound.md).
      # 3.6 is the floor for asp_report --pc-align-min-points, which the
      # WorldView notebooks need for pc_align on their 1.2 x 1 km area
      # (3.5 brought --figures-directory, which shows report figures inline).
      - asp-plot>=3.6,<4
