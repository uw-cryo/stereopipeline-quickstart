<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Bundle adjustment varies camera parameters and tie point positions to shrink reprojection errors">
  <defs>
    <marker id="oarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#eb6834"/>
    </marker>
  </defs>

  <!-- figure surface -->
  <rect x="0.5" y="0.5" width="759" height="379" rx="10" fill="#fcfcfb" stroke="#0b0b0b" stroke-opacity="0.1"/>

  <!-- rays from each camera to each tie point -->
  <g stroke="#898781" stroke-width="1" opacity="0.65">
    <line x1="180" y1="72" x2="270" y2="296"/>
    <line x1="180" y1="72" x2="390" y2="283"/>
    <line x1="180" y1="72" x2="510" y2="297"/>
    <line x1="580" y1="72" x2="270" y2="296"/>
    <line x1="580" y1="72" x2="390" y2="283"/>
    <line x1="580" y1="72" x2="510" y2="297"/>
  </g>

  <!-- satellites with adjustment arcs -->
  <g transform="translate(180,56)">
    <rect x="-26" y="-6" width="16" height="12" fill="#2a78d6"/>
    <rect x="10" y="-6" width="16" height="12" fill="#2a78d6"/>
    <rect x="-9" y="-9" width="18" height="18" rx="3" fill="#52514e"/>
  </g>
  <path d="M 148 34 A 34 34 0 0 1 212 34" fill="none" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#oarrow)"/>
  <g transform="translate(580,56)">
    <rect x="-26" y="-6" width="16" height="12" fill="#2a78d6"/>
    <rect x="10" y="-6" width="16" height="12" fill="#2a78d6"/>
    <rect x="-9" y="-9" width="18" height="18" rx="3" fill="#52514e"/>
  </g>
  <path d="M 548 34 A 34 34 0 0 1 612 34" fill="none" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#oarrow)"/>
  <text x="380" y="30" text-anchor="middle" font-size="12" fill="#52514e">the optimizer nudges camera position and orientation</text>

  <!-- image strip on left camera: observed vs predicted pixel -->
  <rect x="120" y="104" width="150" height="24" rx="5" fill="#fcfcfb" stroke="#898781"/>
  <line x1="224" y1="107" x2="224" y2="125" stroke="#2a78d6" stroke-width="2.5"/>
  <line x1="243" y1="107" x2="243" y2="125" stroke="#eb6834" stroke-width="2.5"/>
  <path d="M 224 132 L 224 138 L 243 138 L 243 132" fill="none" stroke="#52514e" stroke-width="1"/>
  <text x="233" y="154" text-anchor="middle" font-size="11" fill="#52514e">reprojection error</text>
  <text x="118" y="170" font-size="11" fill="#2a78d6">matched pixel</text>
  <text x="118" y="185" font-size="11" fill="#eb6834">where the camera model says it should be</text>

  <!-- terrain -->
  <path d="M 60 312 Q 380 258 700 316" fill="none" stroke="#c3c2b7" stroke-width="1.5"/>

  <!-- tie points -->
  <circle cx="270" cy="296" r="4" fill="#0b0b0b"/>
  <circle cx="390" cy="283" r="4" fill="#0b0b0b"/>
  <circle cx="510" cy="297" r="4" fill="#0b0b0b"/>
  <!-- adjustment arrows on middle tie point -->
  <g stroke="#eb6834" stroke-width="1.5" stroke-dasharray="4 3">
    <line x1="402" y1="283" x2="418" y2="283" marker-end="url(#oarrow)"/>
    <line x1="390" y1="271" x2="390" y2="255" marker-end="url(#oarrow)"/>
  </g>
  <text x="380" y="345" text-anchor="middle" font-size="12" fill="#52514e">tie points on the ground are nudged too</text>
</svg>
